# -------------------------
# Kubernetes API (6443)
# -------------------------
frontend api
    bind 192.168.122.252:6443
    mode tcp
    default_backend api_backend

backend api_backend
    balance roundrobin
    mode tcp
    server test-ctlplane-0   192.168.122.58:6443 check
    server test-bootstrap    192.168.122.56:6443 check

# -------------------------
# Machine Config Server (22623)
# -------------------------
frontend mcs
    bind 192.168.122.252:22624
    mode tcp
    default_backend mcs_backend

backend mcs_backend
    balance roundrobin
    mode tcp
    server test-bootstrap 192.168.122.56:22624 check

# -------------------------
# Ingress HTTP/HTTPS
# -------------------------
frontend ingress_http
    bind 192.168.122.252:80
    mode tcp
    default_backend ingress_backend

frontend ingress_https
    bind 192.168.122.252:443
    mode tcp
    default_backend ingress_backend

backend ingress_backend
    balance roundrobin
    mode tcp
    server test-ctlplane-0 192.168.122.58:80 check
